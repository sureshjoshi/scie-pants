name: Scheduled cargo audit
on:
  schedule:
  - cron: 11 8 * * *
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
